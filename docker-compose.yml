services:
  postgres:
    image: postgres:16
    container_name: sabify-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sabify
      POSTGRES_PASSWORD: sabify_password
      POSTGRES_DB: sabify_db

    ports:
      # Host port 5434 avoids clashing with any
      # locally installed PostgreSQL on 5432.
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: