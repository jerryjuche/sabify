{{ define "sidebar" }}

<aside class="dash-sidebar" id="dash-sidebar">

    <div class="dash-sidebar-inner">


        <!-- Brand -->
        <a href="/" class="dash-brand" aria-label="Learning Intelligence home">
            <span class="dash-brand-mark" aria-hidden="true">
                <img src="/static/img/logo.svg" alt="" width="34" height="34">
            </span>
            <span class="dash-brand-name">
                Learning<span>Intelligence</span>
            </span>
        </a>


        <!-- Navigation -->
        <nav class="dash-nav" aria-label="Student navigation">
            <p class="dash-nav-label">Learn</p>

            <ul class="dash-nav-list">

                <li>
                    <a href="/student/courses"
                       class="dash-nav-link {{ if eq .CurrentPage "courses" }}is-active{{ end }}"
                       {{ if eq .CurrentPage "courses" }}aria-current="page"{{ end }}>
                        <svg class="dash-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/>
                            <path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/>
                        </svg>
                        <span>My Courses</span>
                    </a>
                </li>

                <li>
                    <a href="/student/quizzes"
                       class="dash-nav-link {{ if eq .CurrentPage "quizzes" }}is-active{{ end }}"
                       {{ if eq .CurrentPage "quizzes" }}aria-current="page"{{ end }}>
                        <svg class="dash-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M9.2 9a2.8 2.8 0 0 1 5.5.7c0 1.8-2.7 2.4-2.7 3.8"/>
                            <circle cx="12" cy="17" r="0.4" fill="currentColor"/>
                        </svg>
                        <span>Quizzes</span>
                    </a>
                </li>

                <li>
                    <a href="/student/results"
                       class="dash-nav-link {{ if eq .CurrentPage "results" }}is-active{{ end }}"
                       {{ if eq .CurrentPage "results" }}aria-current="page"{{ end }}>
                        <svg class="dash-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 20V10"/>
                            <path d="M10 20V4"/>
                            <path d="M16 20v-7"/>
                            <path d="M22 20H2"/>
                        </svg>
                        <span>My Results</span>
                    </a>
                </li>

                <li>
                    <a href="/student/study-groups"
                       class="dash-nav-link {{ if eq .CurrentPage "groups" }}is-active{{ end }}"
                       {{ if eq .CurrentPage "groups" }}aria-current="page"{{ end }}>
                        <svg class="dash-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="9" cy="8" r="3.2"/>
                            <path d="M3.5 19c.6-3 2.8-4.5 5.5-4.5S13.9 16 14.5 19"/>
                            <circle cx="17" cy="9.5" r="2.4"/>
                            <path d="M15.8 14.6c2.4.2 4.1 1.5 4.7 4"/>
                        </svg>
                        <span>Study Groups</span>
                    </a>
                </li>

            </ul>
        </nav>


        <!-- User block -->
        <div class="dash-user">

            <div class="dash-user-chip">
                <span class="dash-avatar" aria-hidden="true">{{ initials .User.Name }}</span>
                <span class="dash-user-meta">
                    <span class="dash-user-name">{{ .User.Name }}</span>
                    <span class="dash-user-role">Student</span>
                </span>
            </div>

            <form method="POST" action="/logout" class="dash-logout-form">
                <button type="submit" class="dash-logout-button">
                    <svg class="dash-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <path d="m16 17 5-5-5-5"/>
                        <path d="M21 12H9"/>
                    </svg>
                    <span>Log out</span>
                </button>
            </form>

        </div>


    </div>

</aside>

{{ end }}
